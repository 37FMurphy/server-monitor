<!DOCTYPE html>
<html>
<head>
    <title>Server Monitor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            background: #f5f5f5;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .stat {
            background: white;
            padding: 20px;
            margin: 10px 0;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .stat h2 {
            margin: 0 0 10px 0;
            color: #555;
        }
        .value {
            font-size: 24px;
            font-weight: bold;
            color: #0066cc;
        }
        button {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #0052a3;
        }
    </style>
</head>
<body>
    <h1>Server Monitor Dashboard</h1>
    
    <div class="stat">
        <h2>CPU Usage</h2>
        <div class="value" id="cpu">--</div>
    </div>
    
    <div class="stat">
        <h2>Memory Usage</h2>
        <div class="value" id="memory">--</div>
    </div>
    
    <div class="stat">
        <h2>Disk Usage</h2>
        <div class="value" id="disk">--</div>
    </div>
        <div class="stat">
        <h2>Network Activity</h2>
        <div class="value" id="network">--</div>
    </div>
    
    <button onclick="refreshStats()">Refresh Now</button>

    <script>
        function refreshStats() {
            fetch('/api/stats')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('cpu').innerText = data.cpu + '%';
                    document.getElementById('memory').innerText = data.memory_used_gb + 'GB / ' + data.memory_total_gb + 'GB (' + data.memory_percent + '%)';
                    document.getElementById('disk').innerText = data.disk_used_gb + 'GB / ' + data.disk_total_gb + 'GB (' + data.disk_percent + '%)';
                    document.getElementById('network').innerText = 'Sent: ' + data.network_sent_mb + 'MB | Received: ' + data.network_recv_mb + 'MB';
                });
        }
        
        // Load stats when page loads
        refreshStats();
        // Auto-refresh every 5 seconds
        setInterval(refreshStats, 5000);
    </script>
</body>
</html>
